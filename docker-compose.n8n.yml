services:
  n8n:
    image: n8nio/n8n:latest
    container_name: scraperapi-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Amsterdam
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Load the local community node from the mounted dist folder
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      # Allow the API container (host network) to be reached from inside n8n
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
      # Mount the built community node into n8n's custom extensions dir
      - .:/home/node/.n8n/custom/n8n-nodes-scraperapi:ro
    extra_hosts:
      # Lets the node hit the Scraper API running on the host (Docker Desktop)
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
